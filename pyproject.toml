[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cram"
version = "0.1.0"
description = "Cram a long document into a tiny KV cache: test-time training of compact KV caches (Latent Compaction)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Tatra Labs" }]
keywords = ["llm", "kv-cache", "long-context", "compression", "test-time-training", "transformers"]
dependencies = ["torch>=2.4", "transformers>=5.0"]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
cram = "cram.cli:main"

[project.urls]
Homepage = "https://github.com/tatra-labs/cram"
Paper = "https://arxiv.org/abs/2610.20582"

[tool.hatch.build.targets.wheel]
packages = ["src/cram"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
